name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays at 12:00 UTC. Re-runs pip-audit + pnpm audit against the locked
    # versions so newly-disclosed CVEs surface without needing a PR.
    - cron: "0 12 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install hash-pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Verify lockfile is in sync with requirements.in
        # Catches hand-edits to requirements.txt before they reach production.
        # Copies each committed lockfile to /tmp, then re-runs pip-compile
        # against the copy (so existing pins anchor transitives), then diffs.
        # `-I` ignores the autogenerated header line that records the command
        # path; any difference in package pins or hashes fails the job.
        run: |
          cp requirements.txt /tmp/requirements.txt.expected
          cp requirements-dev.txt /tmp/requirements-dev.txt.expected
          pip-compile --generate-hashes --strip-extras --quiet \
            --output-file=/tmp/requirements.txt.expected requirements.in
          diff -u -I '^#    pip-compile' requirements.txt /tmp/requirements.txt.expected
          pip-compile --generate-hashes --strip-extras --allow-unsafe --quiet \
            --output-file=/tmp/requirements-dev.txt.expected requirements-dev.in
          diff -u -I '^#    pip-compile' requirements-dev.txt /tmp/requirements-dev.txt.expected

      - name: Run tests with coverage gate
        run: pytest --cov=app --cov-report=term-missing

      - name: Audit production dependencies
        # pip-audit blocks on any advisory. Document accepted findings with
        # `--ignore-vuln GHSA-...` and a justifying comment in this file.
        run: pip-audit --requirement requirements.txt --strict

  frontend:
    name: Frontend (vitest + pnpm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build (also type-checks via `tsc -b`)
        run: pnpm build

      - name: Audit production dependencies
        # --audit-level=high keeps moderate/low noise out. --prod excludes the
        # dev-dependency tree (build tooling) from gating CI.
        run: pnpm audit --audit-level=high --prod
